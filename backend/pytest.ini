[pytest]
# Per-test wall-clock ceiling so a hung/infinite-looping test aborts with a
# Timeout traceback (naming the test) instead of hanging the whole suite --
# and the Bash tool call running it -- indefinitely. The full suite
# normally runs in ~10s, so 20s per test is generous headroom, not a real
# budget. No timeout_method is set on purpose: pytest-timeout picks
# "signal" (SIGALRM) on macOS/Linux, which raises inside the hung test and
# lets the rest of the suite keep running, vs. "thread" (its only option
# on platforms without SIGALRM), which aborts the whole process --
# scripts/run_tests.py's hard-timeout watchdog exists for that fallback.
timeout = 20
