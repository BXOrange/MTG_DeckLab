<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTG Deck Analyzer</title>
  <link rel="stylesheet" href="src/styles/main.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-left">
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Menü ein-/ausblenden" aria-expanded="true">
        <span class="burger-bar"></span>
        <span class="burger-bar"></span>
        <span class="burger-bar"></span>
      </button>
      <h1>MTG Deck Analyzer</h1>
    </div>
    <div id="header-connection-status"></div>
  </header>

  <div class="app-body">
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav">
        <div class="nav-group" data-group="deckManagement">
          <button class="nav-group-toggle" type="button">Deck-Management</button>
          <div class="nav-group-items">
            <button class="tab-button" data-tab="import" type="button">Deck editieren</button>
            <button class="tab-button" data-tab="importDeck" type="button">Import Deck</button>
            <button class="tab-button" data-tab="savedDecks" type="button">Decks verwalten</button>
            <button class="tab-button" data-tab="analyze" type="button">Deck analysieren</button>
          </div>
        </div>
        <div class="nav-group" data-group="singleplayer">
          <button class="nav-group-toggle" type="button">Singleplayer</button>
          <div class="nav-group-items">
            <button class="tab-button" data-tab="goldfish" type="button">Goldfisch</button>
            <button class="tab-button" data-tab="replay" type="button">Puzzle/Replay</button>
          </div>
        </div>
        <button class="tab-button" data-tab="multiplayer" type="button">Multiplayer</button>
        <button class="tab-button" data-tab="connection" type="button">Einstellungen</button>
        <div class="nav-group" data-group="information">
          <button class="nav-group-toggle" type="button">Information</button>
          <div class="nav-group-items">
            <button class="tab-button" data-tab="cache" type="button">Karten-Cache</button>
            <button class="tab-button" data-tab="status" type="button">Engine-Status</button>
          </div>
        </div>
      </nav>
    </aside>

    <main>
      <section id="view-import" class="view"></section>
      <section id="view-import-deck" class="view"></section>
      <section id="view-saved-decks" class="view"></section>
      <section id="view-analyze" class="view"></section>
      <section id="view-goldfish" class="view"></section>
      <section id="view-replay" class="view"></section>
      <section id="view-multiplayer" class="view"></section>
      <section id="view-cache" class="view"></section>
      <section id="view-connection" class="view"></section>
      <section id="view-status" class="view"></section>
    </main>
  </div>

  <script type="module" src="src/js/app.js"></script>
</body>
</html>
