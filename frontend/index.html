<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeckLab</title>
  <link rel="stylesheet" href="src/styles/main.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-left">
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Menü ein-/ausblenden" data-i18n-aria-label="nav.menuToggle" aria-expanded="true">
        <span class="burger-bar"></span>
        <span class="burger-bar"></span>
        <span class="burger-bar"></span>
      </button>
      <h1 class="app-brand">
        <img class="app-brand-logo" src="assets/logos/decklab-logo-03-d-monogram-cropped.png" alt="DeckLab" />
      </h1>
    </div>
    <div class="app-header-right">
      <div id="header-connection-status"></div>
      <button class="tab-button icon-button settings-button" data-tab="connection" type="button" title="Einstellungen" aria-label="Einstellungen" data-i18n-title="header.settings" data-i18n-aria-label="header.settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.14 7.14 0 0 0 .06-.94 7.14 7.14 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.14.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.6.22l2.39-.96c.49.38 1.04.7 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.14-.56 1.63-.94l2.39.96c.24.1.46 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
      </button>
      <button class="tab-button icon-button profile-button" data-tab="profile" type="button" title="Profil" aria-label="Profil" data-i18n-title="header.profile" data-i18n-aria-label="header.profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      </button>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav">
        <div class="nav-group" data-group="deckManagement">
          <button class="nav-group-toggle" type="button" data-i18n="nav.deckManagement">Deck-Management</button>
          <div class="nav-group-items">
            <button class="tab-button" data-tab="savedDecks" type="button" data-i18n="nav.savedDecks">Decks verwalten</button>
            <button class="tab-button" data-tab="importDeck" type="button" data-i18n="nav.importDeck">Import Deck</button>
            <button class="tab-button" data-tab="import" type="button" data-i18n="nav.editDeck">Deck editieren</button>
            <button class="tab-button" data-tab="analyze" type="button" data-i18n="nav.analyzeDeck">Deck analysieren</button>
          </div>
        </div>
        <div class="nav-group" data-group="singleplayer">
          <button class="nav-group-toggle" type="button" data-i18n="nav.singleplayer">Singleplayer</button>
          <div class="nav-group-items">
            <button class="tab-button" data-tab="goldfish" type="button" data-i18n="nav.goldfish">Goldfisch</button>
            <button class="tab-button" data-tab="solo" type="button" data-i18n="nav.solo">Solo gegen Bots</button>
            <button class="tab-button" data-tab="replay" type="button" data-i18n="nav.replay">Puzzle/Replay</button>
          </div>
        </div>
        <div class="nav-group" data-group="multiplayer">
          <button class="nav-group-toggle" type="button" data-i18n="nav.multiplayer">Multiplayer</button>
          <div class="nav-group-items">
            <button class="tab-button" data-tab="mpSetup" type="button" data-i18n="nav.mpSetup">Setup</button>
            <!-- Disabled until a game actually exists; multiplayerView.js
                 enables it via app.js's onBoardAvailable hook. -->
            <button class="tab-button" data-tab="mpBoard" type="button" disabled title="Erst verfügbar, wenn du in einem Spiel bist" data-i18n="nav.mpBoard" data-i18n-title="nav.mpBoardDisabledHint">Board</button>
          </div>
        </div>
        <div class="nav-group" data-group="information">
          <button class="nav-group-toggle" type="button" data-i18n="nav.information">Information</button>
          <div class="nav-group-items">
            <button class="tab-button" data-tab="cache" type="button" data-i18n="nav.cache">Karten-Cache</button>
            <button class="tab-button" data-tab="status" type="button" data-i18n="nav.engineStatus">Engine-Status</button>
            <button class="tab-button" data-tab="help" type="button" data-i18n="nav.help">Hilfe</button>
          </div>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="gf-scale-controls" role="group" aria-label="Brett-Größe" data-i18n-aria-label="bd.scale.label">
          <button class="gf-scale-btn" id="board-scale-down" type="button" title="Brett verkleinern" data-i18n-title="bd.scale.smaller">−</button>
          <button class="gf-scale-reset" id="board-scale-reset" type="button" title="Auf 100 % zurücksetzen" data-i18n-title="bd.scale.resetTitle">100%</button>
          <button class="gf-scale-btn" id="board-scale-up" type="button" title="Brett vergrößern" data-i18n-title="bd.scale.larger">+</button>
        </div>
      </div>
    </aside>

    <main>
      <section id="view-saved-decks" class="view"></section>
      <section id="view-import" class="view"></section>
      <section id="view-import-deck" class="view"></section>
      <section id="view-analyze" class="view"></section>
      <section id="view-goldfish" class="view"></section>
      <section id="view-solo" class="view"></section>
      <section id="view-replay" class="view"></section>
      <section id="view-mp-setup" class="view"></section>
      <section id="view-mp-board" class="view"></section>
      <section id="view-cache" class="view"></section>
      <section id="view-connection" class="view"></section>
      <section id="view-profile" class="view"></section>
      <section id="view-status" class="view"></section>
      <section id="view-help" class="view"></section>
    </main>
  </div>

  <script type="module" src="src/js/app.js"></script>
</body>
</html>
